name: ColorizeDesignerRebuild
options:
  bundleIdPrefix: kz.colorize
  deploymentTarget:
    iOS: '17.0'
targets:
  ColorizeDesignerRebuild:
    type: application
    platform: iOS
    sources:
      - path: ColorizeDesignerRebuild
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.colorize.designer.rebuild
        PRODUCT_NAME: Colorize Designer
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 'Импорт фотографий фасада, логотипов и изображений в макет.'
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 'Сохранение экспортированных макетов.'
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_VERSION: '5.9'
