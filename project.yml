name: ColorizeDesigner
options:
  bundleIdPrefix: kz.colorize
  deploymentTarget:
    iOS: '17.0'
targets:
  ColorizeDesigner:
    type: application
    platform: iOS
    sources:
      - path: ColorizeDesigner
    resources:
      - path: ColorizeDesigner/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.colorize.designer
        PRODUCT_NAME: Colorize Designer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 'Импорт фото фасада и изображений в макет.'
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 'Сохранение экспортированных макетов.'
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_VERSION: '5.9'
