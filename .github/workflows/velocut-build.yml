name: Build VeloCut AI IPA

on:
  workflow_dispatch:
  push:
    branches: [ velocut-build ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Xcode 16 async seek and persist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('VeloCutAI/VeloCutAI/VeloCutAIApp.swift')
          text = path.read_text()
          old = '            player.seek(to: CMTime(seconds: safe, preferredTimescale: 600), toleranceBefore: .zero, toleranceAfter: .zero)'
          new = '            await player.seek(to: CMTime(seconds: safe, preferredTimescale: 600), toleranceBefore: .zero, toleranceAfter: .zero)'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
          if ! git diff --quiet; then
            git config user.name "VeloCut Build Bot"
            git config user.email "actions@users.noreply.github.com"
            git add VeloCutAI/VeloCutAI/VeloCutAIApp.swift
            git commit -m "Fix Xcode async seek [skip ci]"
            git push origin HEAD:velocut-build
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: VeloCutAI
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: VeloCutAI
        run: |
          set -o pipefail
          xcodebuild \
            -project VeloCutAI.xcodeproj \
            -scheme VeloCutAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        working-directory: VeloCutAI
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/VeloCutAI.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry VeloCutAI-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeloCutAI-v0.3-unsigned-ipa
          path: VeloCutAI/VeloCutAI-unsigned.ipa
          if-no-files-found: error
