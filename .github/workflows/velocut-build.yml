name: Build VeloCut AI IPA

on:
  workflow_dispatch:
  push:
    branches: [ velocut-build ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.4 source hotfixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('VeloCutAI/VeloCutAI/VeloCutV4.swift')
          s = p.read_text()
          s = s.replace('min(max(value, 0, ), 2)', 'min(max(value, 0), 2)')
          s = s.replace(',-.35...35)', ',-0.35...0.35)')
          p.write_text(s)
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: VeloCutAI
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: VeloCutAI
        run: |
          set -o pipefail
          xcodebuild \
            -project VeloCutAI.xcodeproj \
            -scheme VeloCutAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        working-directory: VeloCutAI
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/VeloCutAI.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry VeloCutAI-v0.4-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeloCutAI-v0.4-unsigned-ipa
          path: VeloCutAI/VeloCutAI-v0.4-unsigned.ipa
          if-no-files-found: error
