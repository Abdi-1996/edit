name: Colorize Design Full V3 IPA

on:
  workflow_dispatch:
  push:
    branches: [ colorize-design-full-v3 ]
    paths:
      - 'ColorizeDesign/**'
      - 'project.yml'
      - '.github/workflows/build-colorize-design.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ColorizeDesign.xcodeproj \
            -scheme ColorizeDesign \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
      - name: Package IPA
        run: |
          rm -rf Payload ColorizeDesignFullV3-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ColorizeDesign.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ColorizeDesignFullV3-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ColorizeDesignFullV3-IPA
          path: ColorizeDesignFullV3-unsigned.ipa
