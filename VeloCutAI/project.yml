name: VeloCutAI
options:
  bundleIdPrefix: com.velocut
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  VeloCutAI:
    type: application
    platform: iOS
    sources:
      - path: VeloCutAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.velocut.ai
        PRODUCT_NAME: VeloCutAI
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VeloCut AI
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Select videos to edit in VeloCut AI.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save exported videos to your photo library.
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ''
    scheme:
      testTargets: []
